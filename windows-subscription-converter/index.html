<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Chimera 订阅转换器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Chimera 订阅转换器首页" id="brand-home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M16 3.5 27 9.75v12.5L16 28.5 5 22.25V9.75L16 3.5Z" stroke="currentColor" stroke-width="1.7" />
              <path d="m10.5 20.5 5.5-9 5.5 9M12.8 17h6.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>Chimera</strong>
            <span>订阅转换器</span>
          </span>
        </a>
        <div class="local-badge" title="所有请求均由本机发起，不经过 Chimera Worker">
          <span class="local-badge-dot" aria-hidden="true"></span>
          完全本地运行
        </div>
      </header>

      <main class="main-content">
        <div class="workspace">
          <section class="panel input-panel" aria-labelledby="input-title">
            <div class="panel-header">
              <div class="panel-title-group">
                <span class="step-index">01</span>
                <div>
                  <h2 id="input-title">输入订阅地址</h2>
                  <p>每行一个 URL，最多 20 个来源</p>
                </div>
              </div>
              <button class="text-button" id="clear-button" type="button">清空</button>
            </div>

            <label class="field-label" for="subscription-urls">订阅 URL</label>
            <div class="textarea-wrap">
              <textarea
                id="subscription-urls"
                class="url-input"
                rows="9"
                spellcheck="false"
                autocomplete="off"
                placeholder="https://example.com/api/v1/client/subscribe?token=...&#10;https://another.example.com/subscription"
              ></textarea>
              <span class="input-hint">支持 HTTP / HTTPS，可包含 Basic Auth 凭据</span>
            </div>

            <div class="validation-message" id="validation-message" hidden></div>

            <details class="advanced-options">
              <summary>
                <span>请求选项</span>
                <span class="summary-note">默认自动识别客户端</span>
              </summary>
              <div class="advanced-content">
                <label class="field-label" for="user-agent-select">User-Agent</label>
                <select id="user-agent-select" class="select-input">
                  <option value="auto">自动识别（推荐）</option>
                  <option value="nekobox">NekoBox / Clash Meta</option>
                  <option value="sing-box">sing-box</option>
                  <option value="clash">Clash Meta</option>
                  <option value="v2rayn">v2rayN</option>
                  <option value="custom">自定义</option>
                </select>
                <input
                  id="custom-user-agent"
                  class="text-input"
                  type="text"
                  maxlength="512"
                  spellcheck="false"
                  autocomplete="off"
                  placeholder="例如：MyClient/1.0"
                  hidden
                />
                <p class="option-note">
                  自动模式会在服务器拒绝请求或返回空内容时，依次尝试常见客户端标识。
                </p>
              </div>
            </details>

            <div class="run-area">
              <div class="progress-copy" id="progress-copy" aria-live="polite">准备就绪</div>
              <div class="progress-track" aria-hidden="true">
                <span id="progress-bar"></span>
              </div>
              <button class="primary-button" id="convert-button" type="button">
                <span class="button-spinner" aria-hidden="true"></span>
                <span class="button-label">获取并转换</span>
                <kbd>Ctrl ↵</kbd>
              </button>
            </div>
          </section>

          <section class="panel result-panel" aria-labelledby="result-title">
            <div class="panel-header">
              <div class="panel-title-group">
                <span class="step-index">02</span>
                <div>
                  <h2 id="result-title">转换结果</h2>
                  <p>标准节点 URI，已自动去重</p>
                </div>
              </div>
              <div class="result-stats" aria-live="polite">
                <span><strong id="node-count">0</strong> 节点</span>
                <span><strong id="source-count">0</strong> 来源</span>
                <span><strong id="duplicate-count">0</strong> 重复</span>
              </div>
            </div>

            <div class="empty-state" id="empty-state">
              <div class="empty-illustration" aria-hidden="true">
                <span></span><span></span><span></span>
              </div>
              <strong>等待转换</strong>
              <p>订阅拉取成功后，节点链接会显示在这里。</p>
            </div>

            <div class="source-list" id="source-list" hidden></div>

            <div class="output-area" id="output-area" hidden>
              <div class="output-heading">
                <label for="output-uris">节点 URI</label>
                <span id="output-size"></span>
              </div>
              <textarea id="output-uris" class="output-textarea" readonly spellcheck="false"></textarea>
              <div class="output-actions">
                <button class="secondary-button" id="copy-button" type="button">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <rect x="6.5" y="6.5" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4" />
                    <path d="M13 6V4.8c0-.7-.6-1.3-1.3-1.3H5.8c-.7 0-1.3.6-1.3 1.3v7.4c0 .7.6 1.3 1.3 1.3H6.5" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                  复制全部
                </button>
                <button class="primary-button compact" id="save-button" type="button">
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M10 3v9m0 0 3.2-3.2M10 12 6.8 8.8M4 13.8v1.5c0 .9.7 1.7 1.7 1.7h8.6c.9 0 1.7-.7 1.7-1.7v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  保存 TXT
                </button>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="app-footer">
        <span>Chimera Subscription Converter</span>
        <span>响应上限 2 MiB · 最多 10 次重定向 · TLS 校验保持开启</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
